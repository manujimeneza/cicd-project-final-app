# Botón de pánico: vuelve un ambiente a una versión anterior, a mano, desde GitHub Actions.
# Actions → "Rollback (botón de pánico)" → Run workflow → elegir ambiente. Sin escribir nada más vuelve a la
# versión inmediatamente anterior a la que está corriendo; el SHA solo hace falta para ir a una versión concreta.
# Si lo último que pasó en el ambiente fue un rollback (manual o automático), "la anterior" sería justo la versión
# que se acaba de quitar; por eso un segundo pánico seguido exige escribir el SHA. La marca se guarda como tag
# del servicio ECS y la borra el siguiente despliegue normal del CI/CD.
name: Rollback (botón de pánico)

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente a revertir
        type: choice
        options: [production, staging]
        default: production
      version:
        description: "Opcional: SHA de una versión concreta. Vacío = la versión inmediatamente anterior"
        type: string
        required: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.17.1'
  IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME }}/kuadra
  AMB: ${{ inputs.ambiente }}

concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ambiente }}  # en producción también pide aprobación
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Elegir la versión a restaurar
        id: destino
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9a-f]{7,40}$ ]]; then echo "Versión no válida"; exit 1; fi
            img="$IMAGE_REPO:$VERSION"
          else
            servicio=$(aws ecs describe-services --cluster "kuadra-$AMB-cluster" --services "kuadra-$AMB-service" \
                       --query 'services[0].serviceArn' --output text)
            marca=$(aws ecs list-tags-for-resource --resource-arn "$servicio" \
                    --query "tags[?key=='kuadra-rollback'].value | [0]" --output text)
            if [ -n "$marca" ] && [ "$marca" != "None" ]; then
              echo "::error::Lo último en $AMB ya fue un rollback (a ${marca}). La versión inmediatamente anterior es" \
                   "la que se acaba de quitar, así que para volver más atrás escribe el SHA en 'version'."
              exit 1
            fi
            actual=$(aws ecs describe-services --cluster "kuadra-$AMB-cluster" --services "kuadra-$AMB-service" \
                     --query 'services[0].taskDefinition' --output text)
            img_actual=$(aws ecs describe-task-definition --task-definition "$actual" \
                         --query 'taskDefinition.containerDefinitions[0].image' --output text)
            rev_actual="${actual##*:}"
            # Terraform da de baja (INACTIVE) la revisión vieja en cada despliegue: hay que buscar en ambas.
            # Se recorren de la más nueva a la más vieja, solo las anteriores a la que está corriendo.
            revisiones=$(for estado in ACTIVE INACTIVE; do
                           aws ecs list-task-definitions --family-prefix "kuadra-$AMB-task" --status "$estado" \
                             --query 'taskDefinitionArns[]' --output text
                         done | tr '\t' '\n' | grep . | sort -t: -k7,7 -n -r | uniq)
            img=""
            for td in $revisiones; do
              [ "${td##*:}" -lt "$rev_actual" ] || continue
              cand=$(aws ecs describe-task-definition --task-definition "$td" \
                     --query 'taskDefinition.containerDefinitions[0].image' --output text)
              if [ "$cand" != "$img_actual" ]; then img="$cand"; break; fi
            done
            if [ -z "$img" ]; then echo "No hay una versión anterior distinta a $img_actual"; exit 1; fi
            echo "Actual: $img_actual (revisión $rev_actual)"
          fi
          echo "Restaurar: $img"
          echo "imagen=$img" >> "$GITHUB_OUTPUT"

      - name: Restaurar con Terraform
        env:
          IMAGEN: ${{ steps.destino.outputs.imagen }}
          TF_VAR_environment_name: ${{ inputs.ambiente }}
          TF_VAR_docker_image_uri: ${{ steps.destino.outputs.imagen }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_token_pruebas: ${{ secrets.TOKEN_PRUEBAS }}
        run: |
          export TF_VAR_app_version="${IMAGEN##*:}"
          terraform init -input=false -backend-config=backend.hcl
          terraform workspace select "$AMB"
          terraform apply -auto-approve -input=false

      - name: Verificar
        env:
          IMAGEN: ${{ steps.destino.outputs.imagen }}
        run: |
          url=$(terraform output -raw app_url)
          for i in $(seq 1 30); do
            if curl -sf "$url/health" | grep -q "${IMAGEN##*:}"; then
              echo "### 🚨 Rollback manual: $AMB ahora corre \`${IMAGEN##*:}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Marcar que lo último fue un rollback
        env:
          IMAGEN: ${{ steps.destino.outputs.imagen }}
        run: |
          servicio=$(aws ecs describe-services --cluster "kuadra-$AMB-cluster" --services "kuadra-$AMB-service" \
                     --query 'services[0].serviceArn' --output text)
          aws ecs tag-resource --resource-arn "$servicio" --tags "key=kuadra-rollback,value=${IMAGEN##*:}"
